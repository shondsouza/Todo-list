<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-App</title>
    <link rel="icon" href="./images/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="card">
      <div class="title">
        <img src="./images/icon.png" alt="todo-icon" />
        <h2>Shon's Todo-list</h2>
      </div>
      <div class="input-feild">
        <input type="text" placeholder="Add your task" id="input" />
        <button type="submit" onclick="addEvent()">Add</button>
      </div>
      <div class="list">
        <div class="task">
          <img src="./images/unchecked.png" alt="" />
          <span class="lists">Go for a Run 1hr</span>
          <div class="icons">
            <i
              class="fa-solid fa-xmark end-item"
              title="Remove"
              id="remove"
            ></i>
            <i
              class="fa-solid fa-pen-to-square end-item"
              title="Edit"
              id="edit"
            ></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
